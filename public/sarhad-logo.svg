<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#goldGrad)" />
  <circle cx="100" cy="100" r="88" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Outer Banner Text Ring -->
  <path id="textPathTop" d="M 25,100 A 75,75 0 1,1 175,100" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="900" fill="#fbbf24" letter-spacing="2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      SARHAD COLLEGE PUNE
    </textPath>
  </text>

  <!-- Inner Crest Shield -->
  <path d="M 100,35 Q 145,35 155,75 Q 155,135 100,165 Q 45,135 45,75 Q 55,35 100,35 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Open Book of Knowledge -->
  <path d="M 65,105 Q 85,95 100,105 Q 115,95 135,105 L 135,125 Q 115,115 100,125 Q 85,115 65,125 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M 100,105 L 100,125" stroke="#1e293b" stroke-width="1.5" />

  <!-- Torch / Flame of Wisdom -->
  <path d="M 100,60 Q 106,72 100,82 Q 94,72 100,60 Z" fill="url(#torchGrad)" filter="url(#glow)" />
  <path d="M 100,66 Q 103,73 100,80 Q 97,73 100,66 Z" fill="#fef08a" />
  <path d="M 97,82 L 103,82 L 101,98 L 99,98 Z" fill="url(#goldGrad)" />

  <!-- Stars -->
  <polygon points="100,42 102,47 107,47 103,50 104,55 100,52 96,55 97,50 93,47 98,47" fill="#fbbf24" />
</svg>
